[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "coo-particles-api-tools-client"
version = "0.1.0"
description = "Python local client shell for CooParticlesAPI web tools."
readme = "README.md"
requires-python = ">=3.10"
authors = [
  { name = "CooStack" }
]
dependencies = []

[project.optional-dependencies]
desktop = [
  "pywebview>=5.4"
]

[project.scripts]
coo-particles-tools = "coo_particles_client.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
